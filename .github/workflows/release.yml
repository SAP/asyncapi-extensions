name: Release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: "NPM Package"
        required: false
        type: boolean
        default: true
      githubRelease:
        description: "GitHub Release"
        required: false
        type: boolean
        default: true

jobs:
  npm:
    if: inputs.npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npmjs:@sap/asyncapi-extensions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # registry-url is required for releasing packages
          registry-url: "https://registry.npmjs.org"

      - name: Install latest npm cli
        run: npm install -g npm@latest

      - run: npm ci

      - name: Publish package
        # --provenance enables the automatic generation of provenance statements (when using trusted publisher, this is automatically enabled and therefore optional)
        # --access public is only hard required for the initial release, but it doesn't hurt having it setup
        # npm version >=11.5.1 required for trusted publisher
        run: npm publish --provenance --access public

  githubRelease:
    needs: [npm]
    if: |
      always() &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure') &&
      inputs.githubRelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push changelog branch, create tags and releases
      pull-requests: write # Open the changelog PR
      actions: write # Dispatch CI workflows for the changelog PR
      checks: write # Mirror CI job results as Check Runs on the changelog PR
      statuses: write # Mirror CI job results as Commit Statuses on the changelog PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@v0.1.0