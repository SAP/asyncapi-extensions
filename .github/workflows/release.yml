name: Release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: "NPM Package"
        required: false
        type: boolean
        default: true
      githubRelease:
        description: "GitHub Release"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  npm:
    if: inputs.npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npmjs:@sap/asyncapi-extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # registry-url is required for releasing packages
          registry-url: "https://registry.npmjs.org"

      - name: Install latest npm cli
        run: npm install -g npm@latest

      - run: npm ci

      - name: Publish package
        # --provenance enables the automatic generation of provenance statements (when using trusted publisher, this is automatically enabled and therefore optional)
        # --access public is only hard required for the initial release, but it doesn't hurt having it setup
        # npm version >=11.5.1 required for trusted publisher
        run: npm publish --provenance --access public

  githubRelease:
    needs: [npm]
    if: |
      always() &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure') &&
      inputs.githubRelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push changelog branch, create tags and releases
      pull-requests: write # Open the changelog PR
      actions: write # Dispatch CI workflows for the changelog PR
      checks: write # Mirror CI job results as Check Runs on the changelog PR
      statuses: write # Mirror CI job results as Commit Statuses on the changelog PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@2d8817b7382966b490d5c78125d97da14ee918bc # main @ 2026-11-14
